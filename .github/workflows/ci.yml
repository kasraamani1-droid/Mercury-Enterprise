name: Mercury CI
on: [push, pull_request]
defaults:
  run:
    working-directory: Mercury_Enterprise_v16
env:
  MERCURY_ENV: development
  MERCURY_AUTH_PASSWORD: ci-test-password-not-for-production
  MERCURY_VERSION: "16.0.0"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q backend/tests
      - run: python -m compileall backend/app
      - name: Frontend JavaScript syntax
        run: |
          find frontend/js -name '*.js' ! -name 'config.local.js' -print0 | xargs -0 -n1 node --check
      - name: Validate compose config
        working-directory: Mercury_Enterprise_v16
        run: docker compose config
        continue-on-error: true
      - name: Docker build (best-effort)
        working-directory: Mercury_Enterprise_v16
        run: docker compose build
        continue-on-error: true
