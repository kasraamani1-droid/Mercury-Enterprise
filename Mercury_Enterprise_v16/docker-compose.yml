services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mercury
      POSTGRES_USER: mercury
      POSTGRES_PASSWORD: mercury
    volumes:
      - mercury_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercury"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - mercury_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    # Optional: publish for local debugging — leave commented in production.
    # ports:
    #   - "6379:6379"

  # Backend is Compose-network only (expose). UI must call same-origin /api via NGINX.
  backend:
    build: ./backend
    env_file: .env
    environment:
      # Fail closed if critical production secrets are missing (validated at API startup).
      MERCURY_ENV: ${MERCURY_ENV:-production}
      # Production system of record — Alembic entrypoint upgrades schema before uvicorn.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mercury:mercury@postgres:5432/mercury}
      HTTPS_ENABLED: ${HTTPS_ENABLED:-false}
      DOMAIN: ${DOMAIN:-}
      JWT_SECRET: ${JWT_SECRET:-}
      COOKIE_SECRET: ${COOKIE_SECRET:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_REQUIRED: ${REDIS_REQUIRED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Production edge: HTTPS termination, security headers, rate limits, ACME webroot.
  # Start with: docker compose --profile production up --build
  nginx:
    profiles: ["production"]
    image: nginx:1.27-alpine
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-mercury.example.com}
      # Only substitute DOMAIN — preserve NGINX variables ($host, $scheme, …).
      NGINX_ENVSUBST_FILTER: "^DOMAIN$"
    volumes:
      - ./deploy/nginx-production.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/live >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  certbot:
    profiles: ["production"]
    image: certbot/certbot:v2.11.0
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    restart: unless-stopped
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"

volumes:
  mercury_postgres:
  mercury_redis:
  certbot_www:
  certbot_certs:
