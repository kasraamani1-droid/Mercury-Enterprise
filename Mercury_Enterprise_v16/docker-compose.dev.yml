services:
  # Developer escape hatch: publishes backend :8000 on the host.
  # Production compose (docker-compose.yml) does not publish :8000; UI uses NGINX /api.
  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
    ports:
      - "8000:8000"
  frontend:
    ports:
      - "3000:80"
