name: Mercury CI
on: [push, pull_request]
defaults:
  run:
    working-directory: Mercury_Enterprise_v16
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r backend/requirements.txt
      - run: pytest -q backend/tests
      - run: python -m compileall backend/app
      - run: node --check frontend/js/api.js
      - run: node --check frontend/js/app.js
      - run: node --check frontend/js/enterprise.js
      - run: node --check frontend/js/enterprise8.js
      - name: Validate compose config
        working-directory: Mercury_Enterprise_v16
        run: docker compose config
        continue-on-error: true
